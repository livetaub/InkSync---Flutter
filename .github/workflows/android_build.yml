name: Build Android App

on:
  workflow_dispatch: # Allows you to manually trigger a build from the GitHub UI
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if triggered manually OR if the commit message contains '[build]'
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Cache Android Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inksync-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
